[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenv = "0.15.0"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["sqlite", "macros", "runtime-tokio"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.7.1", features = ["fs"] }
uuid = { version = "1", features = ["v7", "serde"] }
